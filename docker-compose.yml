version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: exposurex-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: exposurex
      POSTGRES_PASSWORD: exposurex_secure_pass_2026!
      POSTGRES_DB: exposurex
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exposurex -d exposurex"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: exposurex-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: exposurex-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://exposurex:exposurex_secure_pass_2026!@db:5432/exposurex
      REDIS_URL: redis://redis:6379/0
      DEMO_MODE: "true"
      SECRET_KEY: "exposurex-super-secret-production-key-change-in-prod-2026"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: exposurex-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3001:3001"

  nginx:
    image: nginx:alpine
    container_name: exposurex-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:

